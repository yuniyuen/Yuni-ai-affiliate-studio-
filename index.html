<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yuni AI Affiliate Studio V3</title><style>body{font-family:Arial;background:#fff8f5;color:#403532;padding:16px}main{max-width:720px;margin:auto;background:#fff;padding:20px;border-radius:22px}input,textarea,select,button{width:100%;padding:12px;margin:7px 0;border-radius:11px;border:1px solid #ddd;font-size:15px}button{background:#8c6458;color:#fff;font-weight:bold;border:0}pre{white-space:pre-wrap;background:#fff8f5;padding:14px;border-radius:12px;line-height:1.5}</style></head><body><main><h1>🌷 Yuni AI Affiliate Studio V3</h1><p>Konten affiliate + storyboard + prompt video + voice-over.</p><label>Nama Produk</label><input id="n" placeholder="Contoh: Kasur busa"><label>Keunggulan Produk</label><textarea id="i" placeholder="Contoh: tebal, nyaman, harga terjangkau"></textarea><label>Gaya</label><select id="s"><option>Natural & relatable</option><option>Review jujur</option><option>POV</option><option>ASMR</option><option>Problem → solusi</option></select><button onclick="g()">🚀 GENERATE KONTEN</button><div id="o"></div><script>function g(){let n=document.getElementById('n').value||'produk ini',i=document.getElementById('i').value||'detail produk',s=document.getElementById('s').value;let vo=`Kalau kamu lagi cari ${n}, coba lihat yang satu ini. ${i}. Buat kamu yang lagi cari produk seperti ini, ini bisa jadi pilihan yang menarik. Kalau penasaran, cek produknya ya.`;let prompt=`Create a realistic vertical 9:16 affiliate product video. Use the uploaded product photo as the exact visual reference. Preserve original shape, proportions, color, material, texture, pattern, logo and important details. Do not redesign or morph the product. Product: ${n}. Key information: ${i}. Style: ${s}. Natural realistic lighting and camera movement. No subtitles, no on-screen text, no watermark, no extra logos.`;document.getElementById('o').innerHTML='<h3>🎯 Hook</h3><pre>Kalau kamu lagi cari '+n+', jangan skip dulu… 👀</pre><h3>🎬 Storyboard 10 detik</h3><pre>0–3 detik — HOOK\nTampilkan produk dengan menarik.\n\n3–6 detik — DETAIL\n'+i+'. Close-up detail utama.\n\n6–8 detik — PEMAKAIAN\nTampilkan penggunaan secara natural.\n\n8–10 detik — CTA\nHero shot produk.</pre><h3>🤖 Prompt AI Video</h3><pre>'+prompt+'</pre><h3>🗣️ Voice-over</h3><pre id="v">'+vo+'</pre><button onclick="speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(document.getElementById(\'v\').innerText))">▶️ PUTAR VOICE-OVER</button><h3>🛒 CTA</h3><pre>Cek detail dan harganya di keranjang kuning ya 🤍</pre>';}</script></main></body></html>
